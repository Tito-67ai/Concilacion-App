server:
  port: 8081

spring:
  application:
    name: conciliacion-app
  datasource:
    url: jdbc:h2:mem:conciliacion;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true
    open-in-view: false
  h2:
    console:
      enabled: true
      path: /h2-console
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 25MB

conciliacion:
  bancos:
    # ── Una entrada por fuente. Para agregar un banco: este bloque + un @Component que
    #    implemente ExtractorBancario. No hay que tocar nada mas.
    #
    # ── DONDE VAN LAS CREDENCIALES: NO ACA. Aca solo va estructura (nombre, si esta
    #    prendido, a que URL pegarle). El token va como variable de entorno:
    #
    #      GALICIA_API_TOKEN=${GALICIA_API_TOKEN:}
    #
    #    con el valor exportado en la maquina o en el secret manager del deploy. Si
    #    queda escrito aca, el proximo `git push` lo sube a GitHub para siempre.
    #    BancoConfiguracion no tiene ningun campo `token` a proposito: agregar uno
    #    obliga a decidir como se cifra.
    #
    # ──Ejemplo de como quedaria un banco real, commented out hasta que exista:
    #
    # GALICIA_API:
    #   nombre: Banco Galicia
    #   habilitado: true
    #   url-base: https://api.banco.com.ar
    #
    # ── Las dos que existen hoy. Son de archivo, no de API: el usuario sube el
    #    extracto y no hay ningun token que guardar.
    EXCEL:
      nombre: Planilla de Excel del banco
      habilitado: true
    PDF:
      nombre: Extracto en PDF del banco
      habilitado: true
    #
    # Para apagar una sin desinstalar nada: `habilitado: false`. El extractor sigue
    # en el codigo pero desaparece del menu Importar, y un POST con ese codigo
    # devuelve 404 con la lista de los que si estan.
  #
  # ── Catalogo de cuentas y circuitos desde Xubio ────────────────────────────────
  #
  # Los desplegables del filtro (cuenta bancaria, cuenta contable, circuito) se
  # llenan con lo que haya en la base. Al arrancar, esta fuente los completa con
  # los catalogos de Xubio.
  #
  # ESTA APAGADA. Mientras este `habilitado: false`:
  #   - no se pide ningun token,
  #   - la app arranca igual, con o sin Xubio,
  #   - los desplegables se llenan con lo que hay en la base (hoy, la semilla).
  #
  # Para prenderla:
  #
  #   1. export XUBIO_CLIENT_ID=...
  #      export XUBIO_CLIENT_SECRET=...
  #   2. poner habilitado: true y la base-url de la API
  #   3. revisar las tres rutas contra la documentacion de Xubio
  #
  # ── ADVERTENCIA SOBRE LAS RUTAS ───────────────────────────────────────────────
  # Las tres rutas de abajo son un SUPUESTO, no algo verificado. Salieron de un
  # ejemplo generico que decia "revisar en la documentacion la URL exacta", y no
  # se pudo confirmar ninguna contra la API real porque no hay credenciales. La
  # primera vez que se prenda esto hay que corregir las tres y el nombre de los
  # campos de la respuesta (ver RespuestaItem, que acepta alias).
  xubio:
    habilitado: false

    # Base de la API, sin barra final. Cambia segun el plan y el ambiente.
    base-url: ${XUBIO_BASE_URL:}

    # Las credenciales NO van aca, y el default vacio es a proposito. Si el valor
    # por defecto fuera el secreto, el `git push` lo sube a GitHub y despues hay
    # que revocarlo. Con default vacio, el error es "faltan credenciales", que es
    # arreglable, y no "el repo esta filtrado", que no lo es.
    client-id: ${XUBIO_CLIENT_ID:}
    client-secret: ${XUBIO_CLIENT_SECRET:}

    ruta-token: /auth/token
    ruta-cuentas-bancarias: /cuentas-bancarias
    ruta-cuentas-contables: /cuentas-contables
    ruta-circuitos: /circuitos

    # Si Xubio no contesta en este tiempo, se corta y se avisa. Sin esto la
    # pantalla de conciliacion se queda esperando para siempre y el usuario no
    # puede distinguir eso de un problema de red propio.
    timeout: 10s

    # Se renueva el token este tiempo antes de que expire, para que no venza
    # entre el chequeo y el uso.
    margen-renovacion: 1m
