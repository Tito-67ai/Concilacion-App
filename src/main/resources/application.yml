server:
  port: 8081

spring:
  application:
    name: conciliacion-app
  datasource:
    url: jdbc:h2:mem:conciliacion;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true
    open-in-view: false
  h2:
    console:
      enabled: true
      path: /h2-console
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 25MB

conciliacion:
  bancos:
    # ── Una entrada por fuente. Para agregar un banco: este bloque + un @Component que
    #    implemente ExtractorBancario. No hay que tocar nada mas.
    #
    # ── DONDE VAN LAS CREDENCIALES: NO ACA. Aca solo va estructura (nombre, si esta
    #    prendido, a que URL pegarle). El token va como variable de entorno:
    #
    #      GALICIA_API_TOKEN=${GALICIA_API_TOKEN:}
    #
    #    con el valor exportado en la maquina o en el secret manager del deploy. Si
    #    queda escrito aca, el proximo `git push` lo sube a GitHub para siempre.
    #    BancoConfiguracion no tiene ningun campo `token` a proposito: agregar uno
    #    obliga a decidir como se cifra.
    #
    # ──Ejemplo de como quedaria un banco real, commented out hasta que exista:
    #
    # GALICIA_API:
    #   nombre: Banco Galicia
    #   habilitado: true
    #   url-base: https://api.banco.com.ar
    #
    # ── Las dos que existen hoy. Son de archivo, no de API: el usuario sube el
    #    extracto y no hay ningun token que guardar.
    EXCEL:
      nombre: Planilla de Excel del banco
      habilitado: true
    PDF:
      nombre: Extracto en PDF del banco
      habilitado: true
    #
    # Para apagar una sin desinstalar nada: `habilitado: false`. El extractor sigue
    # en el codigo pero desaparece del menu Importar, y un POST con ese codigo
    # devuelve 404 con la lista de los que si estan.
  #
  # ── Catalogo de cuentas y circuitos desde Xubio ────────────────────────────────
  #
  # Dos de los tres desplegables del filtro (cuenta contable y circuito) se llenan
  # con los catalogos de Xubio al arrancar. El tercero, cuenta bancaria, NO: la API
  # de Xubio no expone las cuentas bancarias de la empresa, y sin CBU no hay forma
  # de conciliar un extracto. Esas quedan como dato local de la app.
  #
  # ESTA APAGADA. Mientras este `habilitado: false`:
  #   - no se pide ningun token,
  #   - la app arranca igual, con o sin Xubio,
  #   - los desplegables se llenan con lo que hay en la base (hoy, la semilla).
  #
  # Para prenderla:
  #
  #   1. export XUBIO_CLIENT_ID=...
  #      export XUBIO_CLIENT_SECRET=...
  #   2. poner habilitado: true y la base-url de la API
  #
  # ── DE DONDE SALEN ESTAS RUTAS ────────────────────────────────────────────────
  #
  # De la spec de Xubio, que publica openly en:
  #
  #   https://xubio.com/API/1.1/swagger.json
  #
  # Antes eran un supuesto tomado de un ejemplo generico, y el yml lo decia. Ya
  # no: se leyeron las definiciones de esa spec y estos son los nombres reales.
  # El token va a `/TokenEndpoint` y las credenciales por HTTP Basic, no en el
  # cuerpo: eso lo define el cliente, no este archivo.
  xubio:
    habilitado: false

    # Base de la API, sin barra final.
    base-url: ${XUBIO_BASE_URL:}

    # Las credenciales NO van aca, y el default vacio es a proposito. Si el valor
    # por defecto fuera el secreto, el `git push` lo sube a GitHub y despues hay
    # que revocarlo. Con default vacio, el error es "faltan credenciales", que es
    # arreglable, y no "el repo esta filtrado", que no lo es.
    client-id: ${XUBIO_CLIENT_ID:}
    client-secret: ${XUBIO_CLIENT_SECRET:}

    ruta-token: /TokenEndpoint
    ruta-cuentas-contables: /cuenta
    ruta-circuitos: /circuitoContableBean
    ruta-mi-empresa: /miempresa

    # ── EMPRESAS ────────────────────────────────────────────────────────────────
    #
    # Una App Cliente de Xubio por empresa. La lista de arriba (client-id y
    # client-secret sueltos) es la empresa "default", y es la que usan los catalogos.
    # Acá abajo van las ADICIONALES.
    #
    # POR QUE HAY QUE DECLARARLAS Y NO SE DESCUBREN SOLAS:
    # la API pública de Xubio no tiene el concepto de estudio ni de "empresas de un
    # usuario". Se recorrió la spec entera (63 rutas) y la palabra "estudio" no
    # aparece: todo es oauth2 client_credentials, y cada par client-id/secret es de
    # UNA sola empresa. El login con usuario y password que sí lista las empresas de
    # un estudio pertenece a la app web de Xubio, que no publica esa API.
    #
    # Para agregar una: en Xubio, Configuración -> Integraciones -> API de Xubio ->
    # Nueva App Cliente. Después se declara acá:
    #
    #   empresas:
    #     - clave: tito
    #       client-id: ${XUBIO_TITO_CLIENT_ID:}
    #       client-secret: ${XUBIO_TITO_CLIENT_SECRET:}
    #     - clave: kiosco
    #       client-id: ${XUBIO_KIOSCO_CLIENT_ID:}
    #       client-secret: ${XUBIO_KIOSCO_CLIENT_SECRET:}
    #
    # El `nombre` NO va acá: sale de `GET /miempresa` de Xubio. Si se escribiera
    # acá, la lista dejaría de coincidir con Xubio en silencio.
    #
    # La `clave` es el valor del desplegable y es lo que queda guardado en el
    # navegador: cambiarle el nombre rompe la selección de quien ya la tenía elegida.
    #
    # Vacía a propósito: con Xubio apagado, o sin App Cliente, la barra muestra
    # "Ninguna empresa configurada". Los secretos van por variable de entorno, y por
    # la misma razón que los de arriba: el default vacío es lo que hace que el error
    # sea "faltan credenciales" y no "el repo está filtrado".
    empresas: []

    # Si Xubio no contesta en este tiempo, se corta y se avisa. Sin esto la
    # pantalla de conciliacion se queda esperando para siempre y el usuario no
    # puede distinguir eso de un problema de red propio.
    timeout: 10s

    # Se renueva el token este tiempo antes de que expire, para que no venza
    # entre el chequeo y el uso.
    margen-renovacion: 1m
