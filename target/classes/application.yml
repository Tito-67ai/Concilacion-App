server:
  port: 8080

spring:
  application:
    name: conciliacion-app
  datasource:
    url: jdbc:h2:mem:conciliacion;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true
    open-in-view: false
  h2:
    console:
      enabled: true
      path: /h2-console