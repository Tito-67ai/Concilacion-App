<div class="filtro card rounded-0 border-secondary-subtle mb-4 shadow-none">
  <div class="card-header bg-white border-bottom-0 pt-3 pb-0 d-flex justify-content-between align-items-center">
    <span class="text-dark" style="font-size: 0.95rem">Filtros</span>
    <button
      type="button"
      class="btn btn-sm p-0 border-0 text-muted"
      (click)="abierto.set(!abierto())"
      [attr.aria-expanded]="abierto()"
      aria-label="Mostrar u ocultar los filtros"
    >
      {{ abierto() ? '⌃' : '⌄' }}
    </button>
  </div>

  @if (abierto()) {
    <div class="card-body pt-2">
      <form (ngSubmit)="aplicarFiltro()">
        <div class="row g-3 mb-3">
          <div class="col-md-4">
            <label for="f-cuenta-bancaria" class="form-label text-muted mb-0" style="font-size: 0.75rem">
              Cuenta bancaria
            </label>
            <div class="input-group input-group-sm">
              <select
                id="f-cuenta-bancaria"
                class="form-select rounded-0 border-secondary-subtle shadow-none"
                [ngModel]="draft().cuentaBancariaId"
                (ngModelChange)="set('cuentaBancariaId', $event)"
                name="cuentaBancariaId"
              >
                <option [ngValue]="null">Todas</option>
                @for (c of opciones().cuentasBancarias; track c.id) {
                  <option [ngValue]="c.id">{{ c.banco }} — {{ c.nombre }}</option>
                }
              </select>
              <button
                type="button"
                class="btn border border-secondary-subtle border-start-0 bg-white text-muted"
                [disabled]="draft().cuentaBancariaId === null"
                (click)="limpiarCampo('cuentaBancariaId')"
                aria-label="Limpiar cuenta bancaria"
              >
                &#10005;
              </button>
            </div>
          </div>

          @if (mostrarContables()) {
            <div class="col-md-4">
              <label for="f-cuenta-contable" class="form-label text-muted mb-0" style="font-size: 0.75rem">
                @if (exigirCampos()) {
                  <span class="text-danger">*</span>
                }
                Cuenta contable
              </label>
              <div class="input-group input-group-sm">
                <select
                  id="f-cuenta-contable"
                  class="form-select rounded-0 border-secondary-subtle shadow-none"
                  [ngModel]="draft().cuentaContableId"
                  (ngModelChange)="set('cuentaContableId', $event)"
                  name="cuentaContableId"
                >
                  <option [ngValue]="null">Todas</option>
                  @for (c of opciones().cuentasContables; track c.id) {
                    <option [ngValue]="c.id">{{ c.codigo }} — {{ c.nombre }}</option>
                  }
                </select>
                <button
                  type="button"
                  class="btn border border-secondary-subtle border-start-0 bg-white text-muted"
                  [disabled]="draft().cuentaContableId === null"
                  (click)="limpiarCampo('cuentaContableId')"
                  aria-label="Limpiar cuenta contable"
                >
                  &#10005;
                </button>
              </div>
            </div>
          }

          <div class="col-md-4">
            <label for="f-desde" class="form-label text-muted mb-0" style="font-size: 0.75rem">
              @if (exigirCampos()) {
                <span class="text-danger">*</span>
              }
              Fecha desde
            </label>
            <input
              id="f-desde"
              type="date"
              class="form-control form-control-sm rounded-0 border-secondary-subtle shadow-none"
              [ngModel]="draft().desde"
              (ngModelChange)="set('desde', $event)"
              name="desde"
            />
          </div>
        </div>

        <div class="row g-3">
          <div class="col-md-4">
            <label for="f-hasta" class="form-label text-muted mb-0" style="font-size: 0.75rem">
              @if (exigirCampos()) {
                <span class="text-danger">*</span>
              }
              Fecha hasta
            </label>
            <input
              id="f-hasta"
              type="date"
              class="form-control form-control-sm rounded-0 border-secondary-subtle shadow-none"
              [ngModel]="draft().hasta"
              (ngModelChange)="set('hasta', $event)"
              name="hasta"
            />
          </div>

          @if (mostrarContables()) {
            <div class="col-md-4">
              <label for="f-circuito" class="form-label text-muted mb-0" style="font-size: 0.75rem">
                @if (exigirCampos()) {
                  <span class="text-danger">*</span>
                }
                Circuito contable
              </label>
              <div class="input-group input-group-sm">
                <select
                  id="f-circuito"
                  class="form-select rounded-0 border-secondary-subtle shadow-none"
                  [ngModel]="draft().circuitoId"
                  (ngModelChange)="set('circuitoId', $event)"
                  name="circuitoId"
                >
                  <option [ngValue]="null">Todos</option>
                  @for (c of opciones().circuitos; track c.id) {
                    <option [ngValue]="c.id">{{ c.nombre }}</option>
                  }
                </select>
                <button
                  type="button"
                  class="btn border border-secondary-subtle border-start-0 bg-white text-muted"
                  [disabled]="draft().circuitoId === null"
                  (click)="limpiarCampo('circuitoId')"
                  aria-label="Limpiar circuito contable"
                >
                  &#10005;
                </button>
              </div>
            </div>
          }

          <div class="col-md-4 d-flex align-items-end justify-content-end gap-2">
            <button
              type="submit"
              class="btn btn-sm btn-outline-dark rounded-0 px-4"
              [disabled]="!puedeAplicar() || cargando()"
            >
              @if (cargando()) {
                <span class="spinner-border spinner-border-sm" role="status" aria-hidden="true"></span>
              } @else {
                Aplicar
              }
            </button>
          </div>
        </div>

        @if (rangoInvalido()) {
          <p class="text-danger small mt-2 mb-0">La fecha desde no puede ser posterior a la fecha hasta.</p>
        } @else if (exigirCampos() && faltan().length > 0) {
          <p class="text-muted small mt-2 mb-0">Falta elegir: {{ faltan().join(', ') }}.</p>
        }
      </form>
    </div>
  }
</div>
